<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Ucapan Sinematik Digital</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #080b12; color: white; overflow-x: hidden; min-height: 100vh; padding-bottom: 90px; }
        
        body::after {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.8); pointer-events: none; z-index: 999;
        }

        .version-badge { position: fixed; top: 10px; right: 15px; background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; color: #94a3b8; z-index: 1000; backdrop-filter: blur(5px); }
        .powered-footer { text-align: center; padding: 20px 0; font-size: 0.8rem; color: #64748b; letter-spacing: 1px; }

        #loadingPage { display: none; text-align: center; padding-top: 40vh; font-size: 1.1rem; color: #ffb8c6; letter-spacing: 1px; padding-left: 20px; padding-right: 20px; }

        /* LANDING PAGE (FULL SCREEN) */
        #landingPage { display: none; justify-content: center; align-items: center; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; background: radial-gradient(circle, #1a2238 0%, #080b12 100%); padding: 20px; z-index: 500; }
        .card-container { background: rgba(28, 34, 53, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,107,129,0.3); border-radius: 20px; padding: 40px 20px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.6); animation: cinematicFadeIn 1.5s ease; }
        .gift-icon { font-size: 60px; margin-bottom: 10px; animation: bounce 2s infinite; filter: drop-shadow(0 0 10px rgba(255,107,129,0.5)); }
        .title-text { color: #ffb8c6; font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; letter-spacing: 2px; text-transform: uppercase; }
        .recipient-name { font-size: 1.6rem; font-weight: 600; margin-bottom: 30px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .btn-buka { background: linear-gradient(135deg, #ff0055, #ff5e7e); color: white; border: none; padding: 15px 30px; border-radius: 30px; font-size: 1rem; font-weight: bold; width: 100%; cursor: pointer; box-shadow: 0 5px 20px rgba(255, 0, 85, 0.4); letter-spacing: 1px; }
        .btn-buka:active { transform: scale(0.95); }

        /* OPENED CARD (FULL SCREEN) */
        #openedCard { display: none; width: 100vw; min-height: 100vh; position: absolute; top: 0; left: 0; padding: 20px; background-color: #080b12; text-align: center; z-index: 600; animation: cinematicFadeIn 1.2s ease; }
        .greeting-box { background: rgba(20, 25, 40, 0.85); backdrop-filter: blur(12px); padding: 25px; border-radius: 16px; margin-bottom: 20px; border: 1px solid rgba(255,107,129,0.4); z-index: 10; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-top: 10px; }
        .greeting-title { color: #ffb8c6; font-size: 1.8rem; margin-bottom: 5px; text-shadow: 0 0 10px rgba(255,184,198,0.3); }
        .greeting-subtitle { color: #fff; font-size: 1.1rem; margin-bottom: 12px; font-weight: 600; }
        .greeting-msg { line-height: 1.5; word-break: break-word; }

        .gallery-container { display: flex; gap: 12px; height: 55vh; overflow: hidden; position: relative; width: 100%; max-width: 500px; margin: 0 auto; mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent); -webkit-mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent); }
        .gallery-col { display: flex; flex-direction: column; gap: 12px; width: 50%; }
        .gallery-col img { width: 100%; height: 180px; border-radius: 10px; object-fit: cover; border: 2px solid rgba(255,184,198,0.2); box-shadow: 0 5px 15px rgba(0,0,0,0.4); }
        
        .scroll-up { animation: scrollUp 28s linear infinite; }
        .scroll-down { animation: scrollDown 28s linear infinite; }

        /* EDITOR STYLES */
        #editorPage { display: none; padding: 20px; max-width: 600px; margin: 0 auto; background-color: #141928; min-height: 85vh; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .editor-title { text-align: center; color: #ffb8c6; margin-bottom: 20px; font-size: 1.4rem; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #cbd5e1; }
        input, select, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background-color: #080b12; color: white; font-size: 0.95rem; }
        
        .style-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .upload-box { border: 2px dashed #475569; padding: 20px; text-align: center; border-radius: 8px; background: rgba(8,11,18,0.5); cursor: pointer; transition: border-color 0.2s; }
        .upload-box:hover { border-color: #ff0055; }
        #previewContainer { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; max-height: 150px; overflow-y: auto; }
        .preview-thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid #ffb8c6; }
        .upload-status { font-size: 0.85rem; color: #22c55e; margin-top: 5px; font-weight: bold; }

        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn-generate { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.95rem; }
        .btn-preview-live { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.95rem; }
        
        .result-box { margin-top: 20px; padding: 15px; background-color: #080b12; border-radius: 8px; display: none; text-align: left; border: 1px dashed #22c55e; }
        .btn-wa-direct { background: #25d366; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-size: 0.95rem; }

        /* POPUP MODAL FULL SCREEN */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #080b12; display: none; flex-direction: column; z-index: 3000; padding: 20px; overflow-y: auto; }
        .modal-full-content { width: 100%; max-width: 500px; margin: 0 auto; text-align: center; position: relative; padding-bottom: 40px; }
        .modal-close-btn { position: fixed; top: 15px; right: 20px; background: rgba(255,255,255,0.15); border: none; color: white; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-weight: bold; font-size: 1.1rem; z-index: 3100; }

        /* NAVIGATION BAR */
        .bottom-nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; background: rgba(20, 25, 40, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 35px; display: flex; justify-content: space-around; align-items: center; padding: 10px 15px; z-index: 4000; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        .nav-item { background: none; border: none; color: #94a3b8; display: flex; flex-direction: column; align-items: center; cursor: pointer; font-size: 0.7rem; gap: 3px; transition: color 0.2s, transform 0.2s; }
        .nav-item span { font-size: 18px; }
        .nav-item:hover, .nav-item.active { color: #ffb8c6; transform: translateY(-2px); }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes scrollUp { 0% { transform: translateY(0); } 100% { transform: translateY(-50%); } }
        @keyframes scrollDown { 0% { transform: translateY(-50%); } 100% { transform: translateY(0); } }
        @keyframes cinematicFadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <div class="version-badge">v4.9 Cinematic</div>

    <div id="loadingPage">Memuat data kartu... ✨</div>

    <div id="editorPage">
        <h2 class="editor-title">🎬 Studio Pembuat Kartu</h2>
        
        <div class="form-group">
            <label>Nama Penerima:</label>
            <input type="text" id="inputName" placeholder="Contoh: Audylia Salsabilla">
        </div>
        
        <div class="form-group">
            <label>Pilih Tema Acara:</label>
            <select id="inputTheme">
                <option value="Ulang Tahun">Ulang Tahun 🎂</option>
                <option value="Pernikahan">Pernikahan 💍</option>
                <option value="Khitanan">Khitanan ✂️</option>
            </select>
        </div>

        <div class="form-group">
            <label>Pesan / Doa Ucapan:</label>
            <textarea id="inputMessage" rows="3" placeholder="Tuliskan pesan indahmu..."></textarea>
        </div>

        <div class="style-row">
            <div class="form-group">
                <label>Ukuran Font (px):</label>
                <input type="number" id="inputFontSize" value="16" min="12" max="24">
            </div>
            <div class="form-group">
                <label>Warna Teks Ucapan:</label>
                <input type="color" id="inputFontColor" value="#d0d5dd" style="height: 45px; padding: 5px; cursor: pointer;">
            </div>
        </div>

        <div class="form-group">
            <label>Upload Foto Galeri (1 Foto):</label>
            <div class="upload-box" onclick="document.getElementById('fileInput').click()">
                📁 Pilih Foto dari HP
                <input type="file" id="fileInput" accept="image/*" multiple style="display: none;" onchange="handleFiles(this.files)">
            </div>
            <div id="uploadStatus" class="upload-status"></div>
            <div id="previewContainer"></div>
            <input type="hidden" id="inputPhotosBase64">
        </div>

        <div class="btn-row">
            <button class="btn-preview-live" onclick="openLivePreview()">👁️ Full Preview</button>
            <button class="btn-generate" id="btnGen" onclick="generateLink()">Buat Kartu</button>
        </div>

        <div id="resultLink" class="result-box">
            <p style="color: #22c55e; margin-bottom: 6px; font-weight: bold; font-size: 0.9rem;">✅ Kartu Berhasil Dibuat!</p>
            <a id="shareableUrl" href="#" target="_blank" style="color: #66b3ff; font-size: 0.85rem; word-break: break-all;">Link</a>
            <a id="whatsappDirectBtn" href="#" target="_blank" class="btn-wa-direct">
                <span>💬</span> Kirim Langsung ke WhatsApp
            </a>
        </div>
    </div>

    <div id="landingPage">
        <div class="card-container">
            <div class="gift-icon">🎁</div>
            <div class="title-text">ADA UCAPAN UNTUKMU</div>
            <div class="recipient-name" id="displayTargetName">Nama Penerima</div>
            <button class="btn-buka" onclick="bukaKartu()">✨ BUKA KARTU</button>
        </div>
    </div>

    <div id="openedCard">
        <div class="greeting-box">
            <h2 class="greeting-title" id="displayTheme">Selamat</h2>
            <div class="greeting-subtitle" id="displayName2">Untuk: Nama</div>
            <p class="greeting-msg" id="displayMessage">Pesan...</p>
        </div>

        <div class="gallery-container" id="mainGalleryContainer">
            <div class="gallery-col scroll-up" id="colLeft"></div>
            <div class="gallery-col scroll-down" id="colRight"></div>
        </div>
    </div>

    <div class="modal-overlay" id="customModal">
        <button class="modal-close-btn" onclick="closeModal()">✕</button>
        <div class="modal-full-content" id="modalBody"></div>
    </div>

    <div class="powered-footer">Powered by Ari GPM</div>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="navAction('home')">
            <span>🏠</span>Beranda
        </button>
        <button class="nav-item" onclick="navAction('edit')">
            <span>✏️</span>Edit Kartu
        </button>
        <button class="nav-item" onclick="navAction('share')">
            <span>🔗</span>Bagikan
        </button>
        <button class="nav-item" onclick="navAction('info')">
            <span>ℹ️</span>Info
        </button>
    </nav>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwUv53A4_UqoaNdM3cOC2YPD5U442tbfoH3y6hHsyhlcvRf04fLBhSOIjxDtxP5M2aM/exec';

        let compressedPhotoArray = [];
        let generatedCardUrl = "";
        let currentRecipientName = "";
        let currentTheme = "";

        function handleFiles(files) {
            const previewContainer = document.getElementById('previewContainer');
            const statusEl = document.getElementById('uploadStatus');
            previewContainer.innerHTML = '';
            compressedPhotoArray = [];

            if (files.length > 0) {
                statusEl.innerText = "⏳ Sedang memproses foto...";
            }

            const maxFiles = Math.min(files.length, 1);
            for (let i = 0; i < maxFiles; i++) {
                let file = files[i];
                let reader = new FileReader();
                
                reader.onload = function (event) {
                    let img = new Image();
                    img.src = event.target.result;
                    img.onload = function () {
                        let canvas = document.createElement('canvas');
                        let ctx = canvas.getContext('2d');
                        let maxWidth = 250;
                        let scaleSize = maxWidth / img.width;
                        
                        canvas.width = maxWidth;
                        canvas.height = img.height * scaleSize;
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        
                        let compressedDataUrl = canvas.toDataURL('image/jpeg', 0.3);
                        compressedPhotoArray.push(compressedDataUrl);

                        let thumb = document.createElement('img');
                        thumb.src = compressedDataUrl;
                        thumb.className = 'preview-thumb';
                        previewContainer.appendChild(thumb);

                        document.getElementById('inputPhotosBase64').value = compressedPhotoArray.join('|||');
                        statusEl.innerText = "✅ Foto siap dikirim!";
                    }
                }
                reader.readAsDataURL(file);
            }
        }

        const urlParams = new URLSearchParams(window.location.search);
        const cardId = urlParams.get('id');

        if (cardId) {
            const loadingEl = document.getElementById('loadingPage');
            loadingEl.style.display = 'block';

            fetch(`${SCRIPT_URL}?action=read&id=${cardId}`)
                .then(response => response.json())
                .then(data => {
                    loadingEl.style.display = 'none';
                    document.getElementById('landingPage').style.display = 'flex';
                    
                    document.getElementById('displayTargetName').innerText = data.nama;
                    document.getElementById('displayName2').innerText = "Untuk: " + data.nama;
                    document.getElementById('displayTheme').innerText = "Selamat " + data.tema + "!";
                    
                    const msgEl = document.getElementById('displayMessage');
                    msgEl.innerText = data.pesan;
                    if(data.fontsize) msgEl.style.fontSize = data.fontsize + 'px';
                    if(data.fontcolor) msgEl.style.color = data.fontcolor;

                    loadGallery(data.foto);
                })
                .catch(err => {
                    loadingEl.style.display = 'none';
                    alert("Gagal memuat data kartu.");
                    document.getElementById('editorPage').style.display = 'block';
                });
        } else {
            document.getElementById('editorPage').style.display = 'block';
        }

        function bukaKartu() {
            document.getElementById('landingPage').style.display = 'none';
            document.getElementById('openedCard').style.display = 'block';
        }

        function loadGallery(photoString) {
            const galleryContainer = document.getElementById('mainGalleryContainer');
            
            if(!photoString || photoString.trim() === "" || photoString === "undefined") {
                galleryContainer.style.display = 'none';
                return;
            }
            galleryContainer.style.display = 'flex';

            const separator = photoString.includes('|||') ? '|||' : ',';
            const photos = photoString.split(separator).map(item => item.trim()).filter(item => item.length > 0);
            
            const colLeft = document.getElementById('colLeft');
            const colRight = document.getElementById('colRight');
            colLeft.innerHTML = '';
            colRight.innerHTML = '';

            let displayPhotos = [...photos, ...photos]; 

            displayPhotos.forEach((url, index) => {
                let img = document.createElement('img');
                img.src = url.startsWith('data:image') ? url : 'data:image/jpeg;base64,' + url;
                img.onerror = function() { this.style.display = 'none'; };
                
                if (index % 2 === 0) {
                    colLeft.appendChild(img);
                } else {
                    colRight.appendChild(img);
                }
            });
        }

        async function generateLink() {
            const nama = document.getElementById('inputName').value.trim();
            const tema = document.getElementById('inputTheme').value;
            const pesan = document.getElementById('inputMessage').value.trim();
            const fontsize = document.getElementById('inputFontSize').value;
            const fontcolor = document.getElementById('inputFontColor').value;
            const foto = document.getElementById('inputPhotosBase64').value.trim();

            if(!nama || !pesan) { 
                alert("Nama Penerima dan Pesan wajib diisi!"); 
                return; 
            }

            // Pastikan jika ada file yang dipilih tapi proses kompresi belum selesai, beri peringatan
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length > 0 && foto === "") {
                alert("Foto sedang diproses, mohon tunggu sebentar hingga muncul tulisan 'Foto siap dikirim!'");
                return;
            }

            currentRecipientName = nama;
            currentTheme = tema;

            const btn = document.getElementById('btnGen');
            btn.innerText = "Menyimpan... ⏳";
            btn.disabled = true;

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ nama, tema, pesan, fontsize, fontcolor, foto })
                });
                const data = await response.json();

                const baseUrl = window.location.href.split('?')[0];
                generatedCardUrl = baseUrl + '?id=' + data.id;

                const resultBox = document.getElementById('resultLink');
                const shareableUrl = document.getElementById('shareableUrl');
                const whatsappBtn = document.getElementById('whatsappDirectBtn');
                
                resultBox.style.display = 'block';
                shareableUrl.href = generatedCardUrl;
                shareableUrl.innerText = generatedCardUrl;

                const waMessage = `Halo ${currentRecipientName}, ada kartu ucapan ${currentTheme} spesial untukmu nih! Silakan buka link berikut ya:\n\n${generatedCardUrl}`;
                whatsappBtn.href = `https://api.whatsapp.com/send?text=${encodeURIComponent(waMessage)}`;

                btn.innerText = "Buat Kartu";
                btn.disabled = false;
            } catch (error) {
                alert("Gagal menyimpan data! Periksa koneksi internet Anda.");
                btn.innerText = "Coba Lagi";
                btn.disabled = false;
            }
        }

        function openLivePreview() {
            const nama = document.getElementById('inputName').value.trim() || 'Nama Penerima';
            const tema = document.getElementById('inputTheme').value;
            const pesan = document.getElementById('inputMessage').value.trim() || 'Pesan ucapan akan muncul di sini...';
            const fontsize = document.getElementById('inputFontSize').value;
            const fontcolor = document.getElementById('inputFontColor').value;

            let previewHtml = `
                <div style="padding-top: 40px;">
                    <h2 style="color: #ffb8c6; margin-bottom: 20px;">👁️ Mode Pratinjau Full-Screen</h2>
                    <div class="greeting-box" style="text-align: left;">
                        <h2 class="greeting-title">Selamat ${tema}!</h2>
                        <div class="greeting-subtitle">Untuk: ${nama}</div>
                        <p class="greeting-msg" style="font-size: ${fontsize}px; color: ${fontcolor};">${pesan}</p>
                    </div>
                    <div class="gallery-container" style="margin-top: 20px; ${compressedPhotoArray.length === 0 ? 'display:none;' : ''}">
                        <div class="gallery-col scroll-up" id="previewColLeft"></div>
                        <div class="gallery-col scroll-down" id="previewColRight"></div>
                    </div>
                </div>
            `;

            document.getElementById('modalBody').innerHTML = previewHtml;
            document.getElementById('customModal').style.display = 'flex';

            const colLeft = document.getElementById('previewColLeft');
            const colRight = document.getElementById('previewColRight');
            colLeft.innerHTML = '';
            colRight.innerHTML = '';

            if(compressedPhotoArray.length > 0) {
                let displayPhotos = [...compressedPhotoArray, ...compressedPhotoArray];
                displayPhotos.forEach((url, index) => {
                    let img = document.createElement('img');
                    img.src = url;
                    if (index % 2 === 0) colLeft.appendChild(img);
                    else colRight.appendChild(img);
                });
            }
        }

        function closeModal() {
            document.getElementById('customModal').style.display = 'none';
        }

        function navAction(action) {
            if (action === 'home' || action === 'edit') {
                window.location.href = window.location.href.split('?')[0];
            } else if (action === 'share') {
                if (window.location.search.includes('id=')) {
                    const currentUrl = window.location.href;
                    const waShareUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent("Halo, ada kartu ucapan spesial untukmu! Buka link ini:\n\n" + currentUrl)}`;
                    window.open(waShareUrl, '_blank');
                } else if (generatedCardUrl) {
                    const waShareUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent("Halo, ada kartu ucapan spesial untukmu! Buka link ini:\n\n" + generatedCardUrl)}`;
                    window.open(waShareUrl, '_blank');
                } else {
                    alert("Silakan buat dan generate kartu terlebih dahulu di menu Editor.");
                }
            } else if (action === 'info') {
                alert("Kartu Ucapan Digital Sinematik\nVersi: 4.9\nFitur: Async Upload Guard Status, Fast Load, WhatsApp Direct.\n\nPowered by Ari GPM");
            }
        }
    </script>
</body>
</html>
