<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Ucapan Digital</title>
    <style>
        /* --- GLOBAL STYLES --- */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f131f; color: white; overflow-x: hidden; }
        
        /* --- VIEWER: LANDING PAGE (Mirip Screenshot) --- */
        #landingPage {
            display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #0f131f;
        }
        .card-container {
            background-color: #1c2235; border-radius: 20px; padding: 40px 20px; width: 90%; max-width: 400px;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .gift-icon { font-size: 60px; margin-bottom: 10px; animation: bounce 2s infinite; }
        .title-text { color: #ff6b81; font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; letter-spacing: 1px; }
        .recipient-name { font-size: 1.5rem; font-weight: 600; margin-bottom: 30px; }
        .btn-buka {
            background: linear-gradient(90deg, #ff0055, #ff0088); color: white; border: none;
            padding: 15px 30px; border-radius: 30px; font-size: 1rem; font-weight: bold; width: 100%;
            cursor: pointer; box-shadow: 0 5px 15px rgba(255, 0, 85, 0.4); transition: transform 0.2s;
        }
        .btn-buka:active { transform: scale(0.95); }

        /* --- VIEWER: OPENED CARD (Galeri & Ucapan) --- */
        #openedCard {
            display: none; min-height: 100vh; padding: 20px; background-color: #0f131f; text-align: center;
        }
        .greeting-box {
            background: rgba(28, 34, 53, 0.8); padding: 20px; border-radius: 15px; margin-bottom: 20px;
            border: 1px solid #ff6b81; backdrop-filter: blur(5px); z-index: 10; position: relative;
        }
        .greeting-title { color: #ff6b81; font-size: 1.8rem; margin-bottom: 10px; }
        
        /* Galeri Foto Slowmo Naik Turun */
        .gallery-container {
            display: flex; gap: 10px; height: 60vh; overflow: hidden; position: relative;
            mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
        }
        .gallery-col { display: flex; flex-direction: column; gap: 10px; width: 50%; }
        .gallery-col img { width: 100%; border-radius: 10px; object-fit: cover; border: 2px solid #333; }
        
        .scroll-up { animation: scrollUp 20s linear infinite; }
        .scroll-down { animation: scrollDown 20s linear infinite; }

        /* --- EDITOR STYLES --- */
        #editorPage {
            display: none; padding: 20px; max-width: 600px; margin: 0 auto; background-color: #1c2235; min-height: 100vh;
        }
        .editor-title { text-align: center; color: #ff6b81; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #aaa; }
        input, select, textarea {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444;
            background-color: #0f131f; color: white;
        }
        .btn-generate {
            background-color: #4CAF50; color: white; border: none; padding: 15px; width: 100%;
            border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        .result-box {
            margin-top: 20px; padding: 15px; background-color: #0f131f; border-radius: 8px; display: none; word-break: break-all;
        }

        /* --- ANIMATIONS --- */
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes scrollUp { 0% { transform: translateY(0); } 100% { transform: translateY(-50%); } }
        @keyframes scrollDown { 0% { transform: translateY(-50%); } 100% { transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="editorPage">
        <h2 class="editor-title">🛠️ Buat Kartu Ucapan</h2>
        
        <div class="form-group">
            <label>Nama Penerima:</label>
            <input type="text" id="inputName" placeholder="Contoh: Audylia Salsabilla">
        </div>
        
        <div class="form-group">
            <label>Tema Acara:</label>
            <select id="inputTheme">
                <option value="Ulang Tahun">Ulang Tahun 🎂</option>
                <option value="Pernikahan">Pernikahan 💍</option>
                <option value="Khitanan">Khitanan ✂️</option>
            </select>
        </div>

        <div class="form-group">
            <label>Pesan/Ucapan:</label>
            <textarea id="inputMessage" rows="4" placeholder="Tulis doa dan harapanmu di sini..."></textarea>
        </div>

        <div class="form-group">
            <label>Link Foto (Pisahkan dengan koma, maksimal 10):</label>
            <textarea id="inputPhotos" rows="4" placeholder="https://linkfoto1.jpg, https://linkfoto2.jpg... (Gunakan link gambar dari imgur, fb, dll)"></textarea>
            <small style="color: #888;">*Karena ini web statis, upload foto harus via link internet (URL).</small>
        </div>

        <button class="btn-generate" onclick="generateLink()">Buat Link & Copy!</button>

        <div id="resultLink" class="result-box">
            <p style="color: #4CAF50; margin-bottom: 10px;">✅ Link berhasil dibuat & disalin!</p>
            <a id="shareableUrl" href="#" target="_blank" style="color: #66b3ff;">Klik di sini untuk melihat</a>
        </div>
    </div>

    <div id="landingPage">
        <div class="card-container">
            <div class="gift-icon">🎁</div>
            <div class="title-text">ADA UCAPAN UNTUKMU</div>
            <div class="recipient-name" id="displayTargetName">Nama Penerima</div>
            <button class="btn-buka" onclick="bukaKartu()">🎵 BUKA KARTU</button>
        </div>
    </div>

    <div id="openedCard">
        <div class="greeting-box">
            <h2 class="greeting-title" id="displayTheme">Selamat Ulang Tahun</h2>
            <h3 style="margin-bottom: 10px;" id="displayName2">Nama</h3>
            <p id="displayMessage">Pesan ucapan akan muncul di sini.</p>
        </div>

        <div class="gallery-container">
            <div class="gallery-col scroll-up" id="colLeft"></div>
            <div class="gallery-col scroll-down" id="colRight"></div>
        </div>
    </div>

    <script>
        // Fungsi membaca URL Parameters
        const urlParams = new URLSearchParams(window.location.search);
        const urlName = urlParams.get('to');
        const urlTheme = urlParams.get('theme');
        const urlMsg = urlParams.get('msg');
        const urlPhotos = urlParams.get('imgs');

        // Router: Tentukan apakah menampilkan Editor atau Viewer
        if (urlName) {
            // Mode Viewer (Ada Link)
            document.getElementById('editorPage').style.display = 'none';
            document.getElementById('landingPage').style.display = 'flex';
            
            // Isi data ke Viewer
            document.getElementById('displayTargetName').innerText = urlName;
            document.getElementById('displayName2').innerText = "Untuk: " + urlName;
            document.getElementById('displayTheme').innerText = "Selamat " + urlTheme + "!";
            document.getElementById('displayMessage').innerText = urlMsg;

            // Load Gambar
            loadGallery(urlPhotos);
        } else {
            // Mode Editor (Tidak ada Link)
            document.getElementById('editorPage').style.display = 'block';
            document.getElementById('landingPage').style.display = 'none';
        }

        // Fungsi Buka Kartu (Animasi Transisi)
        function bukaKartu() {
            document.getElementById('landingPage').style.display = 'none';
            document.getElementById('openedCard').style.display = 'block';
            // Disini bisa ditambahkan script untuk play musik otomatis jika punya file mp3
        }

        // Fungsi Load Galeri Foto Slowmo
        function loadGallery(photoString) {
            if(!photoString) return;
            const photos = photoString.split(',');
            const colLeft = document.getElementById('colLeft');
            const colRight = document.getElementById('colRight');
            
            // Duplikasi array agar animasi infinite scroll terlihat mulus
            let displayPhotos = [...photos, ...photos]; 

            displayPhotos.forEach((url, index) => {
                let img = document.createElement('img');
                img.src = url.trim();
                img.onerror = function() { this.src = 'https://via.placeholder.com/150?text=Foto+Error'; };
                
                if (index % 2 === 0) {
                    colLeft.appendChild(img);
                } else {
                    colRight.appendChild(img);
                }
            });
        }

        // Fungsi Generate Link (Editor Mode)
        function generateLink() {
            const name = document.getElementById('inputName').value;
            const theme = document.getElementById('inputTheme').value;
            const msg = document.getElementById('inputMessage').value;
            const photos = document.getElementById('inputPhotos').value;

            if(!name || !msg) {
                alert("Nama dan Pesan wajib diisi!");
                return;
            }

            // Buat parameter URL yang di-encode
            const params = new URLSearchParams({
                to: name,
                theme: theme,
                msg: msg,
                imgs: photos
            });

            // Buat Link Final
            const baseUrl = window.location.href.split('?')[0];
            const finalUrl = baseUrl + '?' + params.toString();

            // Tampilkan hasil
            const resultBox = document.getElementById('resultLink');
            const shareableUrl = document.getElementById('shareableUrl');
            
            resultBox.style.display = 'block';
            shareableUrl.href = finalUrl;
            shareableUrl.innerText = finalUrl;

            // Copy ke Clipboard
            navigator.clipboard.writeText(finalUrl).then(() => {
                // Berhasil copy
            });
        }
    </script>
</body>
</html>
